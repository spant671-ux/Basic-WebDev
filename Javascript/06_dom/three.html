<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating DOM Elements</title>
</head>
<body style="background-color: #212121; color: white;">
    
</body>
<script>
    // Creating a new <div> element node in memory (not yet attached to the DOM tree):
    const div = document.createElement('div')
    console.log(div);

    // Setting class and ID properties on the newly created element:
    div.className = "main"
    div.id = "myId"

    // Overwriting ID with a dynamically generated random ID:
    div.id = Math.round(Math.random() * 10 + 1)

    // Setting custom HTML attributes using setAttribute(name, value):
    div.setAttribute("title", "generated title")

    // Styling the element directly via JS style properties:
    div.style.backgroundColor = "green"
    div.style.padding = "12px"

    // Adding text content option 1 (div.innerText = "Hello World"):
    // div.innerText = "Hello World"

    // Adding text content option 2 (Optimized approach creating a dedicated Text Node):
    const addText = document.createTextNode("Hello World")
    div.appendChild(addText)

    // Attaching/Appending the completed <div> element node into the visible DOM body tree:
    document.body.appendChild(div)
</script>
</html>
