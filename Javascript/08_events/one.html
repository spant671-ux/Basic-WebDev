<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Events & Event Handling</title>
</head>
<body style="background-color: #414141; color: aliceblue;">
    <h2>Amazing image</h2>
    <div>
        <ul id="images">
            <li><img width="200px" id="photoshop" src="https://images.pexels.com/photos/3561339/pexels-photo-3561339.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="photoshop"></li>
            <li><img width="200px" id="japan" src="https://images.pexels.com/photos/3532553/pexels-photo-3532553.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="river" src="https://images.pexels.com/photos/3532551/pexels-photo-3532551.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="owl" src="https://images.pexels.com/photos/3532552/pexels-photo-3532552.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="" ></li>
            <li><img width="200px" id="prayer" src="https://images.pexels.com/photos/2522671/pexels-photo-2522671.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><a style="color: aliceblue;" href="https://google.com" id="google">Google</a></li>
        </ul>
   </div>
</body>
<script>
    // ==================== JavaScript Events: Definition & Core Concepts ====================

    /*
    What is an Event?
    - An event in JavaScript is a notification or signal emitted by the browser when an action or occurrence takes place on the webpage.
    - Examples of occurrences: User clicking a button, pressing a key, submitting a form, resizing the window, or loading the document.

    Core Event Terminology:
    1. Event Target   : The DOM element node where the event originated or to which it is attached.
    2. Event Handler  : A JavaScript callback function that executes in response to a specific event firing.
    3. Event Listener : A method (addEventListener) registered on a DOM node to monitor for specific event types.

    Categories of Common Browser Events:
    - Mouse Events    : click, dblclick, mousedown, mouseup, mousemove, mouseenter, mouseleave
    - Keyboard Events : keydown, keyup, keypress
    - Form Events     : submit, change, input, focus, blur
    - Document/Window : load, DOMContentLoaded, resize, scroll
    */

    // Traditional Event Handler (Discouraged because it limits multiple listeners & propagation control):
    // document.getElementById('owl').onclick = function(){
    //     alert("owl clicked");
    // }


    /*
    Why addEventListener is Preferred:
    - Allows attaching multiple event handlers to the same element.
    - Provides access to Event object properties (e.type, e.target, e.clientX, etc.).
    - Enables control over Event Propagation (Bubbling vs. Capturing).
    
    Key Event Object (e) Properties:
    1. e.type             : Type of event (e.g. 'click', 'keydown').
    2. e.timeStamp        : Time (in ms) when the event occurred.
    3. e.defaultPrevented : Boolean indicating if default browser action was prevented.
    4. e.target           : The specific element node that triggered the event.
    5. e.currentTarget    : The element node to which the event listener is attached.
    6. Mouse Coordinates  : e.clientX, e.clientY (relative to viewport), e.screenX, e.screenY (relative to screen).
    7. Keyboard Modifiers : e.altKey, e.ctrlKey, e.shiftKey, e.keyCode.
    */


    // ==================== Event Propagation: Bubbling vs Capturing ====================

    /*
    3rd Parameter of addEventListener(type, listener, useCapture):
    - false (default) -> EVENT BUBBLING: Event propagates upwards from inner target child to outer parent container (e.g., owl -> ul -> body -> document).
    - true            -> EVENT CAPTURING / TRICKLING: Event propagates downwards from outer parent container to inner target child (e.g., document -> body -> ul -> owl).
    */

    // Event Listener attached to Parent Container (ul#images):
    // document.getElementById('images').addEventListener('click', function(e){
    //     console.log("clicked inside the ul");
    // }, false);

    // Event Listener attached to Inner Child Element (#owl):
    // document.getElementById('owl').addEventListener('click', function(e){
    //     console.log("owl clicked");
    //     // e.stopPropagation() stops the event from bubbling up to parent listeners!
    //     e.stopPropagation();
    // }, false);
    
    // Preventing Default Behavior (e.preventDefault()):
    // document.getElementById('google').addEventListener('click', function(e){
    //     // Prevents default link navigation to google.com
    //     e.preventDefault();
    //     // Stops event bubbling up to container
    //     e.stopPropagation();
    //     console.log('google clicked');
    // }, false);


    // ==================== Event Delegation & Dynamic Removal ====================

    /*
    Event Delegation:
    - Attaching a single event listener to a parent element (#images) to handle events triggered by any of its child elements.
    - Highly efficient for dynamic lists instead of binding listeners to every individual child node.
    */

    document.querySelector('#images').addEventListener('click', function(e){
        // e.target.tagName returns uppercase tag name (e.g., 'IMG', 'LI', 'A')
        console.log(e.target.tagName);

        // Check if the clicked target element is specifically an image <img> tag:
        if(e.target.tagName == 'IMG'){
            console.log(e.target.id);
            // Access the parent <li> element node of the clicked image:
            let removeIt = e.target.parentNode;

            // Option 1: Modern remove() method:
            removeIt.remove();

            // Option 2: Traditional removeChild() method:
            // removeIt.parentNode.removeChild(removeIt);
        }
    })
</script>
</html>
