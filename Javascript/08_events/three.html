<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async JavaScript: setInterval & clearInterval</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <h1>Async JavaScript: setInterval & clearInterval</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
    // ==================== Async Timing Events: setInterval & clearInterval ====================

    /*
    1. setInterval(callback, delayInMs):
       - A Web API timer method that repeatedly executes the callback function at every specified interval (1000ms = 1s).
       - Returns a unique numeric timer ID (e.g. 1, 2, 3) representing the running timer.

    2. clearInterval(timerId):
       - Cancels and halts the running setInterval timer corresponding to the provided ID.

    3. Scope of intervalId:
       - Declared in the outer scope (let intervalId) so both the Start and Stop click handlers can access and share it.
    */

    // Callback function to execute repeatedly every second:
    const sayDate = function(){
        console.log("start", Date.now());
    };

    // Shared variable to store the timer ID across event listeners:
    let intervalId;

    // Attach click event listener to the Start button:
    document.getElementById('start').addEventListener('click', function(){
        // Prevent starting duplicate interval timers if one is already running:
        if (!intervalId) {
            intervalId = setInterval(sayDate, 1000);
        }
    });

    // Attach click event listener to the Stop button:
    document.getElementById('stop').addEventListener('click', function(){
        // Stop the running interval using its stored ID:
        clearInterval(intervalId);
        // Reset the variable to null so it can be cleanly restarted later:
        intervalId = null;
    });
</script>
</html>
